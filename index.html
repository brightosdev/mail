<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Mail System</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #fcfbf7; font-family: Georgia, serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-stone-800 p-4">

    <div class="w-full max-w-md border border-stone-200 bg-white p-8 rounded-xl shadow-sm">
        <h1 class="text-2xl font-light tracking-wide text-center mb-1 text-stone-700 italic">Bright Mail</h1>
        <p class="text-xs text-stone-400 text-center mb-8 uppercase tracking-widest">Serverless Delivery</p>

        <form id="mailForm" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-wider text-stone-500 mb-1">Your Resend API Key</label>
                <input type="password" id="apiKey" required class="w-full border-b border-stone-200 py-1 focus:outline-none focus:border-stone-500 text-sm font-mono tracking-tight" placeholder="re_...">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 mb-1">Custom Name</label>
                    <input type="text" id="customName" required class="w-full border-b border-stone-200 py-1 focus:outline-none focus:border-stone-500 text-sm" placeholder="e.g., velvet">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 mb-1">Domain</label>
                    <input type="text" disabled class="w-full border-b border-stone-200 py-1 text-stone-400 bg-transparent text-sm" value="@resend.dev">
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-stone-500 mb-1">To (Recipient Email)</label>
                <input type="email" id="toEmail" required class="w-full border-b border-stone-200 py-1 focus:outline-none focus:border-stone-500 text-sm" placeholder="your.personal@email.com">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-stone-500 mb-1">Subject</label>
                <input type="text" id="subject" required class="w-full border-b border-stone-200 py-1 focus:outline-none focus:border-stone-500 text-sm" placeholder="A quiet note...">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-stone-500 mb-1">Message</label>
                <textarea id="message" rows="4" required class="w-full border border-stone-200 p-2 rounded focus:outline-none focus:border-stone-500 text-sm bg-stone-50/50 resize-none" placeholder="Write your thought..."></textarea>
            </div>

            <button type="submit" class="w-full bg-stone-800 hover:bg-stone-900 text-stone-100 text-sm py-3 rounded-lg transition duration-200 font-medium tracking-wide">
                Dispatch Message
            </button>
        </form>
        <p id="status" class="mt-4 text-center text-xs font-medium"></p>
    </div>

    <script>
        document.getElementById('mailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Sending into the ether...";
            statusEl.className = "mt-4 text-center text-xs text-stone-500";

            const apiKey = document.getElementById('apiKey').value;
            const fromName = document.getElementById('customName').value;
            const toEmail = document.getElementById('toEmail').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            // A trükk: A Resend API helyett egy ingyenes allorigins proxy-n küldjük át, ami átugorja a CORS hibát
            const targetUrl = 'https://resend.com';
            const proxyUrl = `https://allorigins.win{encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        from: `${fromName} <onboarding@resend.dev>`,
                        to: [toEmail],
                        subject: subject,
                        text: message
                    }),
                    // Ezzel jelezzük a böngészőnek, hogy ne akadékoskodjon a CORS miatt
                    mode: 'cors'
                });

                if (response.ok) {
                    statusEl.textContent = "Sent successfully ✨";
                    statusEl.className = "mt-4 text-center text-xs text-emerald-600 font-semibold";
                } else {
                    const errData = await response.json();
                    statusEl.textContent = `Error: ${errData.message || 'Failed to send'}`;
                    statusEl.className = "mt-4 text-center text-xs text-rose-600";
                }
            } catch (err) {
                // Ha a sima fetch a böngészőből még mindig tiltott a Resend miatt, kiírjuk a valódi okot
                statusEl.textContent = "CORS restriction blocked direct browser sending. Try deploying to Vercel/Netlify for a real backend backend wrapper!";
                statusEl.className = "mt-4 text-center text-xs text-rose-600 px-2";
                
                console.error("CORS Error context:", err);
            }
        });
    </script>

</body>
</html>
